<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script>
<script src="katex/contrib/auto-render.min.js"></script>
<style>
  html,body{margin:0;padding:0;background:transparent;color:#111;}
  body{padding:4px 6px;font-size:16px;line-height:1.6;font-family:-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;}
  code{background:#f2f2f2;padding:1px 3px;border-radius:3px;}
  .katex{font-size:1.12em;}
</style>
</head>
<body><div id="out"></div>
<script>
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function loadText(t){
  // 先转义普通文本不想要的 HTML，再把数学部分交给 auto-render 识别
  var el=document.getElementById('out');
  el.innerHTML=esc(t||'').replace(/\n/g,'<br>');
  try {
    renderMathInElement(el, {
      delimiters:[
        {left:'$$', right:'$$', display:true},
        {left:'\\[', right:'\\]', display:true},
        {left:'\\(', right:'\\)', display:false},
        {left:'$', right:'$', display:false},
        {left:'\\begin{equation}', right:'\\end{equation}', display:true},
        {left:'\\begin{align}', right:'\\end{align}', display:true},
        {left:'\\begin{equation*}', right:'\\end{equation*}', display:true},
        {left:'\\begin{align*}', right:'\\end{align*}', display:true}
      ],
      throwOnError:false
    });
  } catch(e){ /* 渲染异常不阻塞显示 */ }
  setTimeout(function(){ if(window.Android) Android.onHeightChange(document.body.scrollHeight); },80);
}
</script>
</body></html>
