<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script>
<style>
  html,body{margin:0;padding:0;background:transparent;color:#111;}
  body{padding:4px 6px;font-size:16px;line-height:1.6;font-family:-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;}
  .katex{font-size:1.12em;}
  .disp{display:block;margin:6px 0;}
  strong,b{font-weight:bold;}
</style>
</head>
<body><div id="out"></div>
<script>
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// 用正则把文本切成【数学段】和【普通段】，数学段交给 KaTeX 渲染
function renderMath(text){
  var re=/\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\)|\\begin\{[a-zA-Z*]+\}[\s\S]*?\\end\{[a-zA-Z*]+\}|\$[^$\n]+\$/g;
  var parts=[], last=0, m;
  while((m=re.exec(text))!==null){
    if(m.index>last) parts.push({t:'t',s:text.slice(last,m.index)});
    parts.push({t:'m',s:m[0]});
    last=m.index+m[0].length;
  }
  if(last<text.length) parts.push({t:'t',s:text.slice(last)});
  var html='';
  for(var i=0;i<parts.length;i++){
    var tok=parts[i];
    if(tok.t==='m'){ html += renderOne(tok.s); }
    else { html += esc(tok.s).replace(/\n/g,'<br>'); }
  }
  return html;
}

function renderOne(raw){
  var tex=raw, display=false;
  if(/^\$\$/.test(raw)){ tex=raw.slice(2,-2); display=true; }
  else if(/^\\\[/.test(raw)){ tex=raw.slice(2,-2); display=true; }
  else if(/^\\\(/.test(raw)){ tex=raw.slice(2,-2); display=false; }
  else if(/^\\begin\{/.test(raw)){ display=true; }
  else if(/^\$/.test(raw)){ tex=raw.slice(1,-1); display=false; }
  try{
    var r=katex.renderToString(tex,{throwOnError:false,displayMode:display,strict:false});
    return display? '<div class="disp">'+r+'</div>' : r;
  }catch(e){ return esc(raw); }
}

function loadText(t){
  var html=renderMath(t||'');
  document.getElementById('out').innerHTML=html;
  setTimeout(function(){ if(window.Android) Android.onHeightChange(document.body.scrollHeight); },80);
}
</script>
</body></html>
