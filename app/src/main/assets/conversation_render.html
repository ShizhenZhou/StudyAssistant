<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script>
<style>
  html,body{margin:0;padding:0;background:transparent;color:#111;}
  body{padding:10px 8px;font-size:16px;line-height:1.6;font-family:-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;overflow-x:hidden;}
  .bubble{max-width:92%;padding:10px 12px;border-radius:14px;margin:8px 0;font-size:15px;line-height:1.6;}
  .bubble.assistant{background:#E9E9E9;color:#111;align-self:flex-start;border:1px solid #ddd;}
  .bubble.user{background:#D8F2D8;color:#111;align-self:flex-end;border:1px solid #bfe6bf;}
  .msgimg{display:block;max-width:100%;max-height:180px;border-radius:8px;margin-top:6px;border:1px solid #ddd;}
  .katex{font-size:1.1em;}
  .katex-display{max-width:100%;overflow-x:auto;overflow-y:hidden;margin:6px 0;}
  /* 生成中断后的蓝色「继续生成」一行 */
  .continue{color:#2196F3;font-weight:600;padding:8px 2px 2px 2px;cursor:pointer;}
  /* ── 多选：气泡右上角选择圆圈 + 选中红框（用 inset 阴影避免边框改变布局） ── */
  .bubble{position:relative;}
  .bubble.selmode{padding-right:36px;}
  .pick{display:none;position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;
        box-sizing:border-box;border:2px solid #9E9E9E;color:#fff;font-size:13px;line-height:18px;
        text-align:center;background:transparent;}
  .bubble.selmode .pick{display:block;}
  .bubble.selected .pick{background:#F44336;border-color:#F44336;}
  .bubble.selected{box-shadow:inset 0 0 0 2px #F44336;}
  /* 多选态下禁止 WebView 自带的长按选文字（蓝色高亮 + 复制菜单），避免与选择圈抢事件 */
  body.selmode, body.selmode *{
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  }
</style>
</head>
<body><div id="out"></div>
<script>
var PH='\uE000';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function tokenize(t){
  var re=/\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\)|\\begin\{[a-zA-Z*]+\}[\s\S]*?\\end\{[a-zA-Z*]+\}|\$[^$\n]+\$/g;
  var store=[],last=0,m,out='';
  while((m=re.exec(t))!==null){ if(m.index>last) out+=t.slice(last,m.index); store.push(m[0]); out+=PH+(store.length-1)+PH; last=m.index+m[0].length; }
  if(last<t.length) out+=t.slice(last);
  return {text:out,store:store};
}
function mdToHtml(s){
  var lines=s.split('\n'),out='',ol=false,ul=false,pre=false,preBuf=[];
  function closeList(){ if(ol){out+='</ol>';ol=false;} if(ul){out+='</ul>';ul=false;} }
  function inline(t){
    t=t.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>');
    t=t.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>').replace(/(^|[^_])_([^_\n]+)_/g,'$1<em>$2</em>');
    return t;
  }
  for(var i=0;i<lines.length;i++){
    var line=lines[i];
    if(/^\s*```/.test(line)){ if(!pre){pre=true;preBuf=[];} else {pre=false;out+='<pre>'+esc(preBuf.join('\n'))+'</pre>';} continue; }
    if(pre){preBuf.push(line);continue;}
    var t=inline(line);
    var h=t.match(/^(#{1,4})\s+(\S.*)$/); if(h){closeList();var n=h[1].length;out+='<h'+n+'>'+h[2]+'</h'+n+'>';continue;}
    if(/^\s*---+\s*$/.test(t)){closeList();out+='<hr>';continue;}
    if(/^\s*[-*]\s+/.test(t)){ if(!ul){closeList();out+='<ul>';ul=true;} out+='<li>'+t.replace(/^\s*[-*]\s+/,'')+'</li>';continue; }
    if(/^\s*\d+\.\s+/.test(t)){ if(!ol){closeList();out+='<ol>';ol=true;} out+='<li>'+t.replace(/^\s*\d+\.\s+/,'')+'</li>';continue; }
    out+=t+'<br>';
  }
  if(pre){out+='<pre>'+esc(preBuf.join('\n'))+'</pre>';}
  closeList(); return out;
}
function renderOne(raw){
  var tex=raw,display=false;
  if(/^\$\$/.test(raw)){tex=raw.slice(2,-2);display=true;}
  else if(/^\\\[/.test(raw)){tex=raw.slice(2,-2);display=true;}
  else if(/^\\\(/.test(raw)){tex=raw.slice(2,-2);display=false;}
  else if(/^\\begin\{/.test(raw)){display=true;}
  else if(/^\$/.test(raw)){tex=raw.slice(1,-1);display=false;}
  try{ var r=katex.renderToString(tex,{throwOnError:false,displayMode:display,strict:false}); return display?'<div class="katex-display">'+r+'</div>':r; }catch(e){ return esc(raw); }
}
function renderMath(text){
  var tok=tokenize(text||''), body=mdToHtml(esc(tok.text));
  return body.replace(/[\uE000](\d+)\uE000/g,function(m,idx){return renderOne(tok.store[+idx]);});
}
function openImg(el){
  try{
    var b=el.getAttribute('data-b64');
    if(b && window.Android && Android.openImage){ Android.openImage(b); }
  }catch(e){}
}
// ── 流式跟随：滚动速度自适应「答案生成速度」（前馈 + 比例追齐），避免固定速率跟不上或抢跑 ──
// following：用户上滑看前文时暂停，回到底部自动恢复
// touching ：用触摸事件判断「是用户在滚」，避免把程序滚动误判成用户滚动
var following = false;   // 打开会话时**默认停在顶部**、不自动跟随；提问后才开始跟随
var touching = false;
var lastMax = 0, lastTs = 0, growthV = 0;   // growthV：内容增长速度（px/s，EMA 平滑）

function bottomY(){ return Math.max(0, document.body.scrollHeight - window.innerHeight); }
var scrollTopAnim = null;
/** 供原生「↑ 回到顶部」按钮调用：快速向上滚动（缓出动画，约 0.25~0.6s），并暂停跟随 */
window.dshScrollToTop = function(){
  following = false; touching = false;
  if(scrollTopAnim){ cancelAnimationFrame(scrollTopAnim); scrollTopAnim = null; }
  var startY = window.scrollY || 0;
  if(startY <= 0) return;
  var t0 = performance.now();
  var dur = Math.min(600, Math.max(240, startY * 0.22));   // 距离越远略久，但整体保持"迅速"
  function step(now){
    var p = Math.min(1, (now - t0) / dur);
    var eased = 1 - Math.pow(1 - p, 3);                    // easeOutCubic：起步快、收尾稳
    window.scrollTo(0, Math.round(startY * (1 - eased)));
    if(p < 1){ scrollTopAnim = requestAnimationFrame(step); }
    else { scrollTopAnim = null; window.scrollTo(0, 0); }
  }
  scrollTopAnim = requestAnimationFrame(step);
};
/** 供原生「↓ 到底部」按钮调用：快速向下滚动（同样的缓出节奏） */
window.dshScrollToBottom = function(){
  following = true;
  var max = bottomY(), startY = window.scrollY || 0;
  if(max - startY <= 1) return;
  if(scrollTopAnim){ cancelAnimationFrame(scrollTopAnim); scrollTopAnim = null; }
  var t0 = performance.now();
  var dur = Math.min(600, Math.max(240, (max - startY) * 0.22));
  function step(now){
    var p = Math.min(1, (now - t0) / dur);
    var eased = 1 - Math.pow(1 - p, 3);
    window.scrollTo(0, Math.round(startY + (max - startY) * eased));
    if(p < 1){ scrollTopAnim = requestAnimationFrame(step); }
    else { scrollTopAnim = null; window.scrollTo(0, max); }
  }
  scrollTopAnim = requestAnimationFrame(step);
};
// 把「是否已在顶部」上报给原生，用于把 ↑ 按钮切换成 ↓（只在状态翻转时上报，避免频繁跨线程调用）
var lastAtTop = null;
/** 立刻回到顶部（换题/换会话时用，不做动画） */
window.dshScrollReset = function(){
  following = false; touching = false;
  if(scrollTopAnim){ cancelAnimationFrame(scrollTopAnim); scrollTopAnim = null; }
  try{ window.scrollTo(0, 0); }catch(e){}
  lastAtTop = null;   // 下一帧重新上报，保证按钮状态正确
};
function reportPos(){
  var scrollable = (document.body.scrollHeight - window.innerHeight) > 40;
  var atTop = scrollable && (window.scrollY <= 2);
  if(atTop !== lastAtTop){
    lastAtTop = atTop;
    try{ if(window.Android && Android.onAtTop){ Android.onAtTop(atTop); } }catch(e){}
  }
}
// 长按消息气泡 → 进入原生多选（编辑）界面
var lpTimer = null, lpMoved = false, lpIdx = -1;
document.addEventListener('touchstart', function(e){
  var el = e.target, bubble = (el && el.closest) ? el.closest('.bubble') : null;
  if(!bubble) return;
  lpIdx = parseInt(bubble.getAttribute('data-idx'));
  lpMoved = false;
  if(lpTimer) clearTimeout(lpTimer);
  lpTimer = setTimeout(function(){
    if(!lpMoved && !isNaN(lpIdx)){
      setSelModeClass(true);   // 立刻关闭长按选文字，避免闪出选择手柄/复制菜单
      try{ if(window.Android && Android.longPressMessage){ Android.longPressMessage(lpIdx); } }catch(err){}
    }
  }, 450);
}, {passive:true});
document.addEventListener('touchmove', function(){
  lpMoved = true;
  if(lpTimer){ clearTimeout(lpTimer); lpTimer = null; }
}, {passive:true});
document.addEventListener('touchend', function(){
  if(lpTimer){ clearTimeout(lpTimer); lpTimer = null; }
}, {passive:true});
function followTick(ts){
  var max = bottomY();
  var dtms = 16;   // 首帧兜底，避免 NaN
  // 估算内容增长速度（指数平滑，抑制突发抖动）
  if(lastTs){
    dtms = Math.max(1, ts - lastTs);
    var inst = (max - lastMax) / dtms * 1000;
    growthV = growthV * 0.85 + Math.max(0, inst) * 0.15;
  }
  lastMax = max; lastTs = ts;
  if(following && !touching){
    var cur = window.scrollY, gap = max - cur;
    if(gap > 0.5){
      var step = growthV * (dtms/1000) + gap * 0.08;   // 前馈跟上生成速度 + 比例项追平差距
      step = Math.max(0.6, Math.min(step, 80));        // 限幅：慢时不低于 0.6px/帧，快时不猛跳
      window.scrollTo(0, Math.min(max, cur + step));
    }
  }
  reportPos();
  requestAnimationFrame(followTick);
}
requestAnimationFrame(followTick);
document.addEventListener('touchstart', function(){ touching = true; }, {passive:true});
document.addEventListener('touchend', function(){
  setTimeout(function(){
    touching = false;
    following = (window.scrollY + window.innerHeight) >= (document.body.scrollHeight - 48);
  }, 250);
}, {passive:true});

// ── 增量渲染：只重建「发生变化的那条消息」，历史消息的 DOM 与 KaTeX 结果原样保留 ──
// （此前每次刷新都 innerHTML 重置整段对话 → 所有公式重新 KaTeX 渲染，长答案会明显卡顿）
var renderedKeys = [];
var renderedSelKey = '';
function msgKey(m){
  var imgs = (m.images && m.images.length) ? m.images.length : 0;
  var firstLen = (m.images && m.images.length && m.images[0]) ? m.images[0].length : 0;
  return m.role + '|' + (m.content||'') + '|' + imgs + '|' + firstLen;
}
function bubbleHtml(m, idx){
  var cls = (m.role==='assistant') ? 'assistant' : 'user';
  var isSel = !!selectedSet[idx];
  var imgHtml = '';
  if(m.images && m.images.length){
    for(var j=0;j<m.images.length;j++){
      var b64=m.images[j];
      // data-b64 供点击放大时回传给原生；多选态下点图 = 切换选中，否则打开全屏查看
      imgHtml+='<img class="msgimg" style="cursor:zoom-in" data-b64="'+b64+'" src="data:image/jpeg;base64,'+b64+'" onclick="imgTap(event,this,'+idx+')">';
    }
  }
  // 末尾的「继续生成」标记：[[CONTINUE|文案]] → 蓝色可点一行（生成中断时由原生追加）
  var text = m.content || '';
  var contLabel = null;
  var ci = text.indexOf('[[CONTINUE|');
  if(ci >= 0){
    var cj = text.indexOf(']]', ci);
    if(cj > ci){ contLabel = text.substring(ci + 11, cj); text = text.substring(0, ci); }
  }
  // 内容为空（例如只有原图的题目气泡）时不渲染正文，避免多出一个空行
  var body = (text && text.length) ? renderMath(text) : '';
  if(contLabel !== null){
    body += '<div class="continue" onclick="event.stopPropagation();continueGen()">'+esc(contLabel)+'</div>';
  }
  return '<div class="bubble '+cls+(selectionMode?' selmode':'')+(isSel?' selected':'')+'" data-idx="'+idx+'"'
       + ' onclick="bubbleTap('+idx+')">' + body + imgHtml + '<div class="pick">'+(isSel?'✓':'')+'</div></div>';
}
// ── 多选状态与交互（长按进入；点气泡切换；圆圈在右上角，选中显示红框） ──
var selectionMode = false;
var selectedSet = {};
/** 开/关「多选态」样式（顺带禁用长按选文字） */
function setSelModeClass(on){
  try{
    if(on){ document.body.classList.add('selmode'); }
    else { document.body.classList.remove('selmode'); }
  }catch(e){}
}
function selInit(sel){
  selectionMode = !!(sel && sel.on);
  selectedSet = {};
  if(sel && sel.selected){ for(var i=0;i<sel.selected.length;i++){ selectedSet[sel.selected[i]] = 1; } }
  setSelModeClass(selectionMode);
}
function bubbleTap(idx){
  if(!selectionMode) return;
  try{ if(window.Android && Android.toggleMessage){ Android.toggleMessage(idx); } }catch(e){}
}
function imgTap(e, el, idx){
  if(e && e.stopPropagation){ e.stopPropagation(); }
  if(selectionMode){ bubbleTap(idx); return; }
  openImg(el);
}
function continueGen(){
  try{ if(window.Android && Android.continueGeneration){ Android.continueGeneration(); } }catch(e){}
}
function renderMessages(arr, sel){
  selInit(sel);
  var out = document.getElementById('out');
  // 选择态变化时必须全量重建（否则已渲染的气泡不会更新圆圈/红框）
  var selKey = (selectionMode ? '1' : '0') + ':' + Object.keys(selectedSet).sort().join(',');
  if(selKey !== renderedSelKey){ renderedKeys = []; renderedSelKey = selKey; }
  // 找出与上次渲染相同的前缀长度 k：前 k 条完全不动
  var k = 0;
  var keys = [];
  for(var i=0;i<arr.length;i++){ keys.push(msgKey(arr[i])); }
  while(k < renderedKeys.length && k < keys.length && renderedKeys[k] === keys[k]) k++;
  // 丢弃第 k 条之后的旧节点
  while(out.childNodes.length > k){ out.removeChild(out.lastChild); }
  // 只重建从 k 开始的部分（流式时通常只有最后一条）
  for(var i=k;i<arr.length;i++){ out.insertAdjacentHTML('beforeend', bubbleHtml(arr[i], i)); }
  renderedKeys = keys;
  // 新的一轮提问（末尾不是助手消息）→ 贴到底部并恢复跟随；**首次渲染不跳**（打开旧会话要停在顶部）
  if(lastCount > 0 && arr.length > lastCount && arr.length && arr[arr.length-1].role !== 'assistant'){
    following = true;
    setTimeout(function(){ try{ window.scrollTo(0, bottomY()); }catch(e){} }, 30);
  }
  setTimeout(function(){ if(window.Android) Android.onHeightChange(document.body.scrollHeight); },80);
}
</script>
</body></html>
