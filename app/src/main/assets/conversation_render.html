<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script>
<style>
  /* ── 主题变量：浅色为默认，body.dark 覆盖（深色主题由原生侧注入，见 renderMessages 的 dark 参数） ──
     此前颜色全是写死的浅色 → 深色主题下气泡仍是浅灰、思考块灰字在深底上对比度极低（用户反馈） */
  :root{
    --fg:#111;
    --bubble-ai:#E9E9E9;  --bubble-ai-border:#ddd;
    --bubble-user:#D8F2D8; --bubble-user-border:#bfe6bf;
    --msg-border:#ddd;
    --think-fg:#8f8f8f; --think-body-fg:#9a9a9a; --think-body-border:#cfcfcf;
    --pick-border:#9E9E9E;
  }
  body.dark{
    --fg:#E6E6E6;
    --bubble-ai:#2B2B30;  --bubble-ai-border:#3C3C43;
    --bubble-user:#1E3A24; --bubble-user-border:#2F5A38;
    --msg-border:#3C3C43;
    --think-fg:#A6A6A6; --think-body-fg:#B6B6B6; --think-body-border:#4A4A52;
    --pick-border:#8A8A8A;
  }
  html,body{margin:0;padding:0;background:transparent;color:var(--fg);}
  body{padding:10px 8px;font-size:16px;line-height:1.6;font-family:-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;overflow-x:hidden;}
  .bubble{max-width:92%;padding:10px 12px;border-radius:14px;margin:8px 0;font-size:15px;line-height:1.6;}
  .bubble.assistant{background:var(--bubble-ai);color:var(--fg);align-self:flex-start;border:1px solid var(--bubble-ai-border);}
  .bubble.user{background:var(--bubble-user);color:var(--fg);align-self:flex-end;border:1px solid var(--bubble-user-border);}
  .msgimg{display:block;max-width:100%;max-height:180px;border-radius:8px;margin-top:6px;border:1px solid var(--msg-border);}
  .katex{font-size:1.1em;}
  .katex-display{max-width:100%;overflow-x:auto;overflow-y:hidden;margin:6px 0;}
  /* 生成中断后的蓝色「继续生成」一行 */
  .continue{color:#2196F3;font-weight:600;padding:8px 2px 2px 2px;cursor:pointer;}
  /* ── 多选：气泡右上角选择圆圈 + 选中红框（用 inset 阴影避免边框改变布局） ── */
  .bubble{position:relative;}
  .bubble.selmode{padding-right:36px;}
  .pick{display:none;position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;
        box-sizing:border-box;border:2px solid var(--pick-border);color:#fff;font-size:13px;line-height:18px;
        text-align:center;background:transparent;}
  .bubble.selmode .pick{display:block;}
  .bubble.selected .pick{background:#F44336;border-color:#F44336;}
  .bubble.selected{box-shadow:inset 0 0 0 2px #F44336;}
  /* 受保护的消息（题干 / AI 首条回复）：圆圈灰掉、不可点 */
  .bubble.selmode.locked .pick{border-color:#6E6E6E;opacity:.45;background:transparent;border-style:dashed;}
  .bubble.selmode.locked{cursor:not-allowed;}
  /* 多选态下禁止 WebView 自带的长按选文字（蓝色高亮 + 复制菜单），避免与选择圈抢事件 */
  body.selmode, body.selmode *{
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  }
  details.origimg{margin-top:6px}
  details.origimg>summary{cursor:pointer;font-size:13px;opacity:.75;padding:2px 0;list-style:none}
  details.origimg .msgimg{margin-top:4px}
  /* 思考块改用普通 div（不再用 <details>）：流式期间气泡每 ~180ms 被重建，
     <details> 的原生折叠既依赖"按下/抬起落在同一节点"、又依赖 ontoggle 落库，
     两者在重建中都不可靠 → 改为 JS 自管展开态 + document 级事件委托 */
  .think{margin-bottom:6px}
  .thinkhead{cursor:pointer;font-size:12px;color:var(--think-fg);opacity:.9;padding:3px 0;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  .thinkbody{font-size:12px;line-height:1.5;color:var(--think-body-fg);white-space:pre-wrap;border-left:2px solid var(--think-body-border);padding:4px 0 4px 8px;margin-top:4px}
  /* 思考块底端的蓝色「折叠思考区」：思考很长时不必再滚回顶部去收起（蓝色与「继续生成」一致） */
  .thinkfold{color:#2196F3;font-size:12px;font-weight:600;padding:6px 0 2px 8px;cursor:pointer;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body><div id="out"></div>
<script>
var PH='\uE000';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function tokenize(t){
  var re=/\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\)|\\begin\{[a-zA-Z*]+\}[\s\S]*?\\end\{[a-zA-Z*]+\}|\$[^$\n]+\$/g;
  var store=[],last=0,m,out='';
  while((m=re.exec(t))!==null){ if(m.index>last) out+=t.slice(last,m.index); store.push(m[0]); out+=PH+(store.length-1)+PH; last=m.index+m[0].length; }
  if(last<t.length) out+=t.slice(last);
  return {text:out,store:store};
}
function mdToHtml(s){
  var lines=s.split('\n'),out='',ol=false,ul=false,pre=false,preBuf=[];
  function closeList(){ if(ol){out+='</ol>';ol=false;} if(ul){out+='</ul>';ul=false;} }
  function inline(t){
    t=t.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>');
    t=t.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>').replace(/(^|[^_])_([^_\n]+)_/g,'$1<em>$2</em>');
    return t;
  }
  for(var i=0;i<lines.length;i++){
    var line=lines[i];
    if(/^\s*```/.test(line)){ if(!pre){pre=true;preBuf=[];} else {pre=false;out+='<pre>'+esc(preBuf.join('\n'))+'</pre>';} continue; }
    if(pre){preBuf.push(line);continue;}
    var t=inline(line);
    var h=t.match(/^(#{1,4})\s+(\S.*)$/); if(h){closeList();var n=h[1].length;out+='<h'+n+'>'+h[2]+'</h'+n+'>';continue;}
    if(/^\s*---+\s*$/.test(t)){closeList();out+='<hr>';continue;}
    if(/^\s*[-*]\s+/.test(t)){ if(!ul){closeList();out+='<ul>';ul=true;} out+='<li>'+t.replace(/^\s*[-*]\s+/,'')+'</li>';continue; }
    if(/^\s*\d+\.\s+/.test(t)){ if(!ol){closeList();out+='<ol>';ol=true;} out+='<li>'+t.replace(/^\s*\d+\.\s+/,'')+'</li>';continue; }
    out+=t+'<br>';
  }
  if(pre){out+='<pre>'+esc(preBuf.join('\n'))+'</pre>';}
  closeList(); return out;
}
function renderOne(raw){
  var tex=raw,display=false;
  if(/^\$\$/.test(raw)){tex=raw.slice(2,-2);display=true;}
  else if(/^\\\[/.test(raw)){tex=raw.slice(2,-2);display=true;}
  else if(/^\\\(/.test(raw)){tex=raw.slice(2,-2);display=false;}
  else if(/^\\begin\{/.test(raw)){display=true;}
  else if(/^\$/.test(raw)){tex=raw.slice(1,-1);display=false;}
  try{ var r=katex.renderToString(tex,{throwOnError:false,displayMode:display,strict:false}); return display?'<div class="katex-display">'+r+'</div>':r; }catch(e){ return esc(raw); }
}
function renderMath(text){
  var tok=tokenize(text||''), body=mdToHtml(esc(tok.text));
  return body.replace(/[\uE000](\d+)\uE000/g,function(m,idx){return renderOne(tok.store[+idx]);});
}
function openImg(el){
  try{
    var b=el.getAttribute('data-b64');
    if(b && window.Android && Android.openImage){ Android.openImage(b); }
  }catch(e){}
}
// ── 流式跟随：滚动速度自适应「答案生成速度」（前馈 + 比例追齐），避免固定速率跟不上或抢跑 ──
// following：用户上滑看前文时暂停，回到底部自动恢复
// touching ：用触摸事件判断「是用户在滚」，避免把程序滚动误判成用户滚动
var following = false;   // 打开会话时**默认停在顶部**、不自动跟随；提问后才开始跟随
var touching = false;
// ★ 用户**显式**按过「↓ 到底部」→ 他要一直跟到底部；
//   此时思考结束的"自动跳到思考结尾/答案开头"必须让路，否则跟随被抢走、
//   而且视图会被拉回思考块边界（思考块很长时 = 大跨度上跳），观感就是"正式答案莫名其妙消失"。
var userForcedFollow = false;
var lastMax = 0, lastTs = 0, growthV = 0;   // growthV：内容增长速度（px/s，EMA 平滑）

function bottomY(){ return Math.max(0, document.body.scrollHeight - window.innerHeight); }
var scrollTopAnim = null;
/** 供原生「↑ 回到顶部」按钮调用：快速向上滚动（缓出动画，约 0.25~0.6s），并暂停跟随 */
window.dshScrollToTop = function(){
  following = false; touching = false; userForcedFollow = false;
  if(scrollTopAnim){ cancelAnimationFrame(scrollTopAnim); scrollTopAnim = null; }
  var startY = window.scrollY || 0;
  if(startY <= 0) return;
  var t0 = performance.now();
  var dur = Math.min(600, Math.max(240, startY * 0.22));   // 距离越远略久，但整体保持"迅速"
  function step(now){
    var p = Math.min(1, (now - t0) / dur);
    var eased = 1 - Math.pow(1 - p, 3);                    // easeOutCubic：起步快、收尾稳
    window.scrollTo(0, Math.round(startY * (1 - eased)));
    if(p < 1){ scrollTopAnim = requestAnimationFrame(step); }
    else { scrollTopAnim = null; window.scrollTo(0, 0); }
  }
  scrollTopAnim = requestAnimationFrame(step);
};
/** 供原生「↓ 到底部」按钮调用：快速向下滚动（同样的缓出节奏） */
window.dshScrollToBottom = function(){
  following = true;
  userForcedFollow = true;   // 显式要求跟随：思考结束的自动跳转要给这条让路（见 renderMessages）
  var max = bottomY(), startY = window.scrollY || 0;
  if(max - startY <= 1) return;
  if(scrollTopAnim){ cancelAnimationFrame(scrollTopAnim); scrollTopAnim = null; }
  var t0 = performance.now();
  var dur = Math.min(600, Math.max(240, (max - startY) * 0.22));
  function step(now){
    var p = Math.min(1, (now - t0) / dur);
    var eased = 1 - Math.pow(1 - p, 3);
    window.scrollTo(0, Math.round(startY + (max - startY) * eased));
    if(p < 1){ scrollTopAnim = requestAnimationFrame(step); }
    else { scrollTopAnim = null; window.scrollTo(0, max); }
  }
  scrollTopAnim = requestAnimationFrame(step);
};
// 把「是否已在顶部」上报给原生，用于把 ↑ 按钮切换成 ↓（只在状态翻转时上报，避免频繁跨线程调用）
var lastAtTop = null;
var lastScrollable = null;   // 是否可滚动（内容超过一屏）
/** 立刻回到顶部（换题/换会话时用，不做动画） */
window.dshScrollReset = function(){
  following = false; touching = false; userForcedFollow = false;
  if(scrollTopAnim){ cancelAnimationFrame(scrollTopAnim); scrollTopAnim = null; }
  try{ window.scrollTo(0, 0); }catch(e){}
  lastAtTop = null;   // 下一帧重新上报，保证按钮状态正确
  lastScrollable = null;
};
/** 只关闭「自动跟随」，不改变滚动位置（例如展开答案时希望画面保持不动） */
window.dshNoFollow = function(){
  following = false; touching = false; userForcedFollow = false;
  if(scrollTopAnim){ cancelAnimationFrame(scrollTopAnim); scrollTopAnim = null; }
};
function reportPos(){
  var scrollable = (document.body.scrollHeight - window.innerHeight) > 40;
  var atTop = scrollable && (window.scrollY <= 2);
  // 会话是否超过一屏也上报：原生据此在「内容未超屏」时隐藏 ↑/↓ 按钮
  if(scrollable !== lastScrollable){
    lastScrollable = scrollable;
    try{ if(window.Android && Android.onScrollable){ Android.onScrollable(scrollable); } }catch(e){}
  }
  if(atTop !== lastAtTop){
    lastAtTop = atTop;
    try{ if(window.Android && Android.onAtTop){ Android.onAtTop(atTop); } }catch(e){}
  }
}
// 长按消息气泡 → 进入原生多选（编辑）界面
var lpTimer = null, lpMoved = false, lpIdx = -1;
document.addEventListener('touchstart', function(e){
  var el = e.target, bubble = (el && el.closest) ? el.closest('.bubble') : null;
  if(!bubble) return;
  lpIdx = parseInt(bubble.getAttribute('data-idx'));
  lpMoved = false;
  if(lpTimer) clearTimeout(lpTimer);
  lpTimer = setTimeout(function(){
    if(!lpMoved && !isNaN(lpIdx)){
      // 已在多选态：长按不再有任何作用（多选内只允许单次点击选择），避免歧义与误操作
      if(selectionMode) return;
      setSelModeClass(true);   // 立刻关闭长按选文字，避免闪出选择手柄/复制菜单
      try{ if(window.Android && Android.longPressMessage){ Android.longPressMessage(lpIdx); } }catch(err){}
    }
  }, 450);
}, {passive:true});
document.addEventListener('touchmove', function(){
  lpMoved = true;
  if(lpTimer){ clearTimeout(lpTimer); lpTimer = null; }
}, {passive:true});
document.addEventListener('touchend', function(){
  if(lpTimer){ clearTimeout(lpTimer); lpTimer = null; }
}, {passive:true});
function followTick(ts){
  var max = bottomY();
  var dtms = 16;   // 首帧兜底，避免 NaN
  // 估算内容增长速度（指数平滑，抑制突发抖动）
  if(lastTs){
    dtms = Math.max(1, ts - lastTs);
    var inst = (max - lastMax) / dtms * 1000;
    growthV = growthV * 0.85 + Math.max(0, inst) * 0.15;
  }
  lastMax = max; lastTs = ts;
  if(following && !touching){
    var cur = window.scrollY, gap = max - cur;
    if(gap > 0.5){
      var step = growthV * (dtms/1000) + gap * 0.08;   // 前馈跟上生成速度 + 比例项追平差距
      step = Math.max(0.6, Math.min(step, 80));        // 限幅：慢时不低于 0.6px/帧，快时不猛跳
      window.scrollTo(0, Math.min(max, cur + step));
    }
  }
  reportPos();
  requestAnimationFrame(followTick);
}
requestAnimationFrame(followTick);
document.addEventListener('touchstart', function(){ touching = true; }, {passive:true});
document.addEventListener('touchend', function(){
  setTimeout(function(){
    touching = false;
    following = (window.scrollY + window.innerHeight) >= (document.body.scrollHeight - 48);
    // 用户自己滑离了底部 → 撤销"显式跟随"（下次思考结束的自动跳转又可以生效）
    if(!following) userForcedFollow = false;
  }, 250);
}, {passive:true});

// ── 增量渲染：只重建「发生变化的那条消息」，历史消息的 DOM 与 KaTeX 结果原样保留 ──
// （此前每次刷新都 innerHTML 重置整段对话 → 所有公式重新 KaTeX 渲染，长答案会明显卡顿）
var renderedKeys = [];
var renderedSelKey = '';
// ★ 此前 lastCount 从未声明/赋值 → 读到未声明变量直接抛 ReferenceError，
//   导致 renderMessages 末尾的「恢复跟随」与 onHeightChange 全成了死代码（自动跟随一直失效）
var lastCount = 0;
var pendingJumpIdx = null;   // 思考刚结束：待跳转到「思考结尾 / 答案开头」的气泡下标
window.thinkUserOpen = {};   // 用户手动展开过
window.thinkUserClosed = {}; // 用户手动收起过（优先级最高，压过原生的 thinkingOpen）
window.thinkJumped = {};     // 已执行过「思考结束跳转」的下标
window.thinkText = {};       // 每个气泡的思考原文（收起时 body 被删掉，切回展开要靠它重填）
window.thinkDone = {};       // 每个气泡的思考是否已结束（决定标题文案）
window.thinkFirstKey = null; // 会话标识：换会话时清空上面的状态，避免旧下标串味
function msgKey(m){
  var imgs = (m.images && m.images.length) ? m.images.length : 0;
  var firstLen = (m.images && m.images.length && m.images[0]) ? m.images[0].length : 0;
  // ★ 思考流必须进 key：否则思考增长时 content 不变 → key 不变 → 增量渲染跳过该气泡 → 思考块整段不刷新
  return m.role + '|' + (m.content||'') + '|' + imgs + '|' + firstLen
       + '|' + ((m.thinking||'').length) + '|' + (m.thinkingOpen?1:0) + '|' + (m.thinkingDone?1:0);
}
function bubbleHtml(m, idx){
  var cls = (m.role==='assistant') ? 'assistant' : 'user';
  var locked = !!lockedSet[idx];              // 题干 / AI 首条回复：多选时不可选、不可删
  var isSel = !locked && !!selectedSet[idx];
  var imgHtml = '';
  if(m.images && m.images.length){
    var imgs = '';
    for(var j=0;j<m.images.length;j++){
      var b64=m.images[j];
      // data-b64 供点击放大时回传给原生；多选态下点图 = 切换选中，否则打开全屏查看
      imgs+='<img class="msgimg" style="cursor:zoom-in" data-b64="'+b64+'" src="data:image/jpeg;base64,'+b64+'" onclick="imgTap(event,this,'+idx+')">';
    }
    // ★ 默认折叠原图：题目以「文字 + 公式」为主（提高易读性），点开才看原始拍摄的图片。
    //   AI 回复里的附图（如追问带图）保持原样直接显示。
    // 只有当气泡正文存在时才折叠（拍题/图文提问：文字为主）；
    // 正文为空说明该气泡只以图为准（复习模式）→ 直接显示图片，避免什么都看不到。
    var hasText = !!(m.content && m.content.length);
    imgHtml = (m.role === 'assistant' || !hasText) ? imgs : ('<details class="origimg"><summary>📷 查看原题图片</summary>' + imgs + '</details>');
  }
  // 末尾的「继续生成」标记：[[CONTINUE|文案]] → 蓝色可点一行（生成中断时由原生追加）
  var text = m.content || '';
  var contLabel = null;
  var ci = text.indexOf('[[CONTINUE|');
  if(ci >= 0){
    var cj = text.indexOf(']]', ci);
    if(cj > ci){ contLabel = text.substring(ci + 11, cj); text = text.substring(0, ci); }
  }
  // 内容为空（例如只有原图的题目气泡）时不渲染正文，避免多出一个空行
  var body = (text && text.length) ? renderMath(text) : '';
  // ★ 思考流：显示在**该气泡的顶端**（浅灰小字、可折叠）
  //   展开态由 JS 自管（window.thinkUserOpen / thinkUserClosed），不用 <details>：
  //   流式重建会把节点换掉，原生折叠既可能丢 click、又可能丢 ontoggle。
  var thinkHtml = '';
  if (m.thinking && m.thinking.length && cls === 'assistant') {
    // 展开态「闭锁」：流式期间原生一直传 thinkingOpen=true，一旦展开过就记住，
    // 之后重渲染（正文到达 / 思考结束）不会再自己收起 —— 否则观感就是"正文一出思考块被吞"。
    var tOpen = !window.thinkUserClosed[idx] && (!!window.thinkUserOpen[idx] || !!m.thinkingOpen);
    if (tOpen) window.thinkUserOpen[idx] = 1;
    // 标题文案的"是否仍在思考"：只有**原生正在流式的那条**才看 thinkingDone，
    // 已保存进 chatItems 的气泡（thinkingOpen=false）一律算思考结束 → 否则生成完标题永远停在"思考中…"
    var tLive = !!m.thinkingOpen;
    var tDone = !!m.thinkingDone || !tLive;
    // 供"点折叠"时无需重建整段即可切回（收起时 body 元素不存在，故把文本与完成态存在 JS 里）
    window.thinkText[idx] = m.thinking;
    window.thinkDone[idx] = tDone;
    thinkHtml = '<div class="think" data-box="' + idx + '">'
      + '<div class="thinkhead" data-think="' + idx + '">' + esc(TL().title) + esc(thinkLabel(tOpen, tDone)) + '</div>'
      + (tOpen ? '<div class="thinkbody">' + esc(m.thinking) + '</div>' : '')
      // 底端蓝色切换行：**展开与收起都在**（展开时=收起、收起时=展开），
      // 思考很长时不用滚回顶部，收起后也不会"什么都不剩"
      + '<div class="thinkfold" data-think="' + idx + '">' + esc(tOpen ? TL().fold : TL().unfold) + '</div>'
      + '</div>';
    // 思考「刚结束」的那一帧 → 安排一次跳转（只跳一次；重新思考时解锁）
    if (m.thinkingDone) {
      if (!window.thinkJumped[idx]) { window.thinkJumped[idx] = 1; pendingJumpIdx = idx; }
    } else {
      delete window.thinkJumped[idx];
    }
  }
  if(contLabel !== null){
    body += '<div class="continue" onclick="event.stopPropagation();continueGen()">'+esc(contLabel)+'</div>';
  }
  return '<div class="bubble '+cls+(selectionMode?' selmode':'')+(isSel?' selected':'')+(locked?' locked':'')+'" data-idx="'+idx+'"'
       + ' onclick="bubbleTap('+idx+')">' + thinkHtml + body + imgHtml
       + (selectionMode ? '<div class="pick">'+(isSel?'✓':'')+'</div>' : '') + '</div>';
}
// ── 多选状态与交互（长按进入；点气泡切换；圆圈在右上角，选中显示红框） ──
var selectionMode = false;
var selectedSet = {};
var lockedSet = {};   // 受保护、不可选中的下标（题干 / AI 首条回复）
/** 开/关「多选态」样式（顺带禁用长按选文字） */
function setSelModeClass(on){
  try{
    if(on){ document.body.classList.add('selmode'); }
    else { document.body.classList.remove('selmode'); }
  }catch(e){}
}
function selInit(sel){
  selectionMode = !!(sel && sel.on);
  selectedSet = {};
  if(sel && sel.selected){ for(var i=0;i<sel.selected.length;i++){ selectedSet[sel.selected[i]] = 1; } }
  lockedSet = {};
  if(sel && sel.locked){ for(var i=0;i<sel.locked.length;i++){ lockedSet[sel.locked[i]] = 1; } }
  setSelModeClass(selectionMode);
}
function bubbleTap(idx){
  if(!selectionMode) return;
  if(lockedSet[idx]) return;                  // 受保护的消息不参与多选
  try{ if(window.Android && Android.toggleMessage){ Android.toggleMessage(idx); } }catch(e){}
}
function imgTap(e, el, idx){
  if(e && e.stopPropagation){ e.stopPropagation(); }
  if(selectionMode){ bubbleTap(idx); return; }
  openImg(el);
}
function continueGen(){
  try{ if(window.Android && Android.continueGeneration){ Android.continueGeneration(); } }catch(e){}
}
// ── 思考块折叠（JS 自管 + document 级委托） ──────────────────────────────
// 为什么不能用 <details> / 节点级 onclick：
//   流式生成时实时气泡的 msgKey 每 ~180ms 就变 → 节点被 removeChild + insertAdjacentHTML 换掉；
//   若"按下"和"抬起"落在不同节点上，浏览器**不会派发 click** → 表现为"点了没反应"。
//   所以这里用 document 上的 touchstart/touchend 自己判定（不依赖节点存活），并按 idx 记账。
// ★ 多语言：思考块的文案由原生侧注入（window.THINK_LABELS），HTML 里只留一份简体兜底。
//   注入点：ConversationWebView 调用 renderMessages(json, sel, labels) 的第三个参数。
var THINK_DEFAULT = {
  title: '💭 思考过程',
  thinking: '（思考中…）',
  collapse: '（点击折叠）',
  expand: '（点击展开）',
  fold: '折叠思考区',
  unfold: '展开思考区'
};
function TL(){
  var L = window.THINK_LABELS;
  if(!L) return THINK_DEFAULT;
  // 逐字段兜底：某个 key 缺失时退回简体，避免出现 undefined
  return {
    title: L.title || THINK_DEFAULT.title,
    thinking: L.thinking || THINK_DEFAULT.thinking,
    collapse: L.collapse || THINK_DEFAULT.collapse,
    expand: L.expand || THINK_DEFAULT.expand,
    fold: L.fold || THINK_DEFAULT.fold,
    unfold: L.unfold || THINK_DEFAULT.unfold
  };
}
function thinkLabel(open, done){
  var L = TL();
  if(!open) return L.expand;
  return done ? L.collapse : L.thinking;
}
/** 立即把某个气泡的思考块切到 open 状态（不重建整段；收起时把正文与底端折叠行一起删掉） */
function applyThinkOpen(idx, open){
  var box = document.querySelector('.think[data-box="' + idx + '"]');
  if(!box) return;                         // 当前不在屏幕上（或已被替换）→ 交给下次渲染
  var head = box.querySelector('.thinkhead');
  var body = box.querySelector('.thinkbody');
  var fold = box.querySelector('.thinkfold');
  if(open && !body){
    body = document.createElement('div');
    body.className = 'thinkbody';
    body.textContent = window.thinkText[idx] || '';
    if(fold) box.insertBefore(body, fold); else box.appendChild(body);   // fold 恒存在，插在它前面
  } else if(!open && body){
    box.removeChild(body);
  }
  // 底端蓝色行两种状态都保留，只换文案
  var L = TL();
  if(fold) fold.textContent = open ? L.fold : L.unfold;
  // 用 textContent 而非 innerHTML：文案是纯文本（含 emoji），不给注入留口子
  if(head) head.textContent = L.title + thinkLabel(open, !!window.thinkDone[idx]);
}
/** 切换某个气泡的思考块展开态，并把用户意图记进 thinkUserOpen/thinkUserClosed */
function toggleThink(idx){
  if(isNaN(idx)) return;
  var nowOpen = !!window.thinkUserOpen[idx] && !window.thinkUserClosed[idx];
  var next = !nowOpen;
  if(next){
    window.thinkUserOpen[idx] = 1; delete window.thinkUserClosed[idx];
  } else {
    delete window.thinkUserOpen[idx]; window.thinkUserClosed[idx] = 1;
    following = false; touching = false;   // 折叠后不要还被"跟随思路滚动"往下拉
    if(scrollTopAnim){ cancelAnimationFrame(scrollTopAnim); scrollTopAnim = null; }
  }
  applyThinkOpen(idx, next);
}
var thinkTouch = null;          // 手指按下时记的候选 {idx,x,y,t}
var thinkClickGuard = 0;        // 刚用 touchend 处理过 → 忽略随后合成的 click，避免切两次
function thinkHeadIdx(node){
  if(!node || !node.closest) return NaN;
  // 顶部标题行 与 底端蓝色「折叠思考区」都可点
  var head = node.closest('.thinkhead') || node.closest('.thinkfold');
  if(!head) return NaN;
  return parseInt(head.getAttribute('data-think'));
}
document.addEventListener('touchstart', function(e){
  if(selectionMode){ thinkTouch = null; return; }   // 多选态：点思考块 = 选中该消息，不折叠
  var idx = thinkHeadIdx(e.target);
  if(isNaN(idx)){ thinkTouch = null; return; }
  var t = (e.touches && e.touches[0]) || {};
  thinkTouch = { idx: idx, x: t.clientX || 0, y: t.clientY || 0, t0: Date.now() };
}, {passive:true});
document.addEventListener('touchend', function(){
  if(!thinkTouch) return;
  var cand = thinkTouch; thinkTouch = null;
  // 长按（≥400ms，长按多选的阈值是 450ms）或滑动（≥12px）不算点击
  if(Date.now() - cand.t0 >= 400) return;
  thinkClickGuard = Date.now() + 600;
  toggleThink(cand.idx);
}, {passive:true});
document.addEventListener('touchmove', function(){ thinkTouch = null; }, {passive:true});
// 兜底：非触摸（鼠标/触控笔）或某些 WebView 只给 click 的情况
document.addEventListener('click', function(e){
  if(selectionMode) return;                         // 多选态：交给 bubbleTap 选中消息
  if(Date.now() < thinkClickGuard) return;
  var idx = thinkHeadIdx(e.target);
  if(isNaN(idx)) return;
  if(e.stopPropagation) e.stopPropagation();
  toggleThink(idx);
}, true);

// labels（可选）：思考块的多语言文案，由原生按界面语言注入；缺省时用简体兜底
// dark（可选）：是否深色主题，由原生注入 → 给 body 加 .dark，CSS 变量随之切换（见文件顶部变量表）
function renderMessages(arr, sel, labels, dark){
  if(dark !== undefined) document.body.classList.toggle('dark', !!dark);
  if(labels && typeof labels === 'object'){
    // 文案变化（切换界面语言）→ 清掉增量渲染缓存，强制整段重建（否则已渲染的气泡不会换文案）
    var lk = JSON.stringify(labels);
    if(lk !== window.thinkLabelsKey){ window.thinkLabelsKey = lk; renderedKeys = []; }
    window.THINK_LABELS = labels;
  }
  selInit(sel);
  var out = document.getElementById('out');
  // 换会话（首条消息变了）→ 清空思考展开/跳转状态，避免旧下标串味
  var firstKey = arr.length ? msgKey(arr[0]) : '';
  if(firstKey !== window.thinkFirstKey){
    window.thinkFirstKey = firstKey;
    window.thinkUserOpen = {}; window.thinkUserClosed = {}; window.thinkJumped = {};
    window.thinkText = {}; window.thinkDone = {};
    pendingJumpIdx = null;
  }
  // 选择态变化时必须全量重建（否则已渲染的气泡不会更新圆圈/红框）
  var selKey = (selectionMode ? '1' : '0') + ':' + Object.keys(selectedSet).sort().join(',')
             + '|' + Object.keys(lockedSet).sort().join(',');
  if(selKey !== renderedSelKey){ renderedKeys = []; renderedSelKey = selKey; }
  // 找出与上次渲染相同的前缀长度 k：前 k 条完全不动
  var k = 0;
  var keys = [];
  for(var i=0;i<arr.length;i++){ keys.push(msgKey(arr[i])); }
  while(k < renderedKeys.length && k < keys.length && renderedKeys[k] === keys[k]) k++;
  // 丢弃第 k 条之后的旧节点
  while(out.childNodes.length > k){ out.removeChild(out.lastChild); }
  // 只重建从 k 开始的部分（流式时通常只有最后一条）
  for(var i=k;i<arr.length;i++){ out.insertAdjacentHTML('beforeend', bubbleHtml(arr[i], i)); }
  renderedKeys = keys;
  // 新的一轮提问（末尾不是助手消息）→ 贴到底部并恢复跟随；**首次渲染不跳**（打开旧会话要停在顶部）
  if(lastCount > 0 && arr.length > lastCount && arr.length && arr[arr.length-1].role !== 'assistant'){
    following = true;
    setTimeout(function(){ try{ window.scrollTo(0, bottomY()); }catch(e){} }, 30);
  }
  lastCount = arr.length;
  // 思考刚结束 → 跳到「思考的结尾 + 正式答案的开头」（只跳一次，且不再被跟随逻辑拉回底部）
  // ★ 例外：用户显式按过「↓ 到底部」时**不跳** —— 他要一直跟到底部看答案，
  //   此时若把视图拉回思考块边界并置 following=false，答案就"消失"在屏幕下方了（用户反馈的真 bug）。
  if(pendingJumpIdx !== null){
    var jIdx = pendingJumpIdx; pendingJumpIdx = null;
    if(!userForcedFollow) setTimeout(function(){
      try{
        var el = out.querySelector('.bubble[data-idx="'+jIdx+'"]');
        if(!el) return;
        // 思考块折叠状态下没有 .thinkbody（或高度为 0）→ 回退成"滚到气泡顶部"，
        // 否则 getBoundingClientRect() 全 0 会把页面跳到错误位置
        var tb = el.querySelector('.thinkbody');
        var tbRect = tb ? tb.getBoundingClientRect() : null;
        var y = (tbRect && tbRect.height > 0)
              ? (tbRect.bottom + (window.scrollY || 0))
              : (el.getBoundingClientRect().top + (window.scrollY || 0));
        following = false; touching = false;
        if(scrollTopAnim){ cancelAnimationFrame(scrollTopAnim); scrollTopAnim = null; }
        window.scrollTo(0, Math.max(0, Math.round(y - 8)));
      }catch(e){}
    }, 40);
  }
  setTimeout(function(){ if(window.Android) Android.onHeightChange(document.body.scrollHeight); },80);
}
</script>
</body></html>
