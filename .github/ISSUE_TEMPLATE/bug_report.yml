name: 问题反馈 / Bug report
description: 报告功能异常或应用崩溃 / Report a bug or crash
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请勿提交 API Key、真实题库、备份或未检查的原始日志。Issue 是公开的。
        Do not include API keys, private study data, backups or unreviewed raw logs. Issues are public.
  - type: textarea
    id: problem
    attributes:
      label: 问题与预期 / Problem and expected behavior
      description: 实际发生了什么，预期是什么？ / What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 偶发问题请说明当时正在做什么。 / For intermittent issues, describe what you were doing.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 完整应用版本 / Full app version
      placeholder: v0.7.3.7, versionCode 130
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 系统与机型 / Android version and device model
  - type: textarea
    id: diagnostics
    attributes:
      label: 精简诊断（可选） / Brief diagnostics (optional)
      description: 从“关于 → 反馈与崩溃报告”预览并复制。分享前检查，不必提供原始日志。 / Preview and copy from About → Feedback & crash report. Review before sharing; raw logs are not required.
      render: text
