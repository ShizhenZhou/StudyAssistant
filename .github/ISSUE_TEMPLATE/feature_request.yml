name: 改进建议 / Feature request
description: 提出功能或交互改进 / Suggest a feature or interaction improvement
title: "[Feature] "
body:
  - type: textarea
    id: need
    attributes:
      label: 使用场景 / Use case
      description: 目前遇到了什么不方便？ / What is inconvenient today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望如何改进 / Suggested improvement
    validations:
      required: true
