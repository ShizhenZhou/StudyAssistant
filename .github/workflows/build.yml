name: build
run-name: "release: ${{ inputs.run_description || github.ref_name }}"
# Validation is local and scoped. Push/PR/tag do not start duplicate builds.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main commit
        required: true
        type: string
      run_description:
        description: Version and concise purpose
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check requested source and credential boundary
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          python3 -B tools/check-secrets.py --tracked
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Build unsigned release APK (no application tests)
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --console=plain
      - name: Record APK identity and hashes
        run: python3 -B tools/ci-release.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-candidate
          path: |
            app/build/release-candidate/*-candidate.apk
            app/build/release-candidate/release-manifest.json
          if-no-files-found: error
          retention-days: 30
