name: build

# 触发：
#  1) 每次 push 到 main / multi_questions → 编译 release APK 并归档（校验用）
#  2) 推 v* 标签 → 编译并把 APK 自动挂到同名 Release
#  3) 手动触发（Actions 页面 Run workflow）
on:
  push:
    branches: [main, multi_questions]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      # 说明：本项目 release 构建使用 debug 签名配置（自用应用），
      # 因此 CI 无需任何 keystore secret 即可产出可安装的 release APK。
      - name: 编译 release APK
        run: ./gradlew assembleRelease --console=plain

      - name: 上传 APK（构建产物，任何触发都会保留 30 天）
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # 标签推送 → 只负责「编译 + 挂附件」：
      #   建 draft Release（草稿），发布者补充图文分组说明后再点发布，
      #   这样 Release 说明与历史版本保持同一种格式（中文、emoji 分组）。
      #   若想改成 GitHub 自动生成说明：draft 改 false，generate_release_notes 改 true。
      - name: 若是标签推送 → 建草稿 Release 并挂上 APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          draft: true
          generate_release_notes: false
          fail_on_unmatched_files: false
