name: build

# 触发：
#  1) 每次 push 到 main / multi_questions → 编译 release APK 并归档（校验用）
#  2) 推 v* 标签 → 编译并把 APK 自动挂到同名 Release
#  3) 手动触发（Actions 页面 Run workflow）
on:
  push:
    branches: [main, multi_questions]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      # ── 发布签名材料（自有证书 + key rotation lineage） ─────────────────────
      # 见 README「发布签名（自有证书 + key rotation）」。仓库 Secrets 里存三样：
      #   RELEASE_KEYSTORE_BASE64 / RELEASE_LINEAGE_BASE64 / RELEASE_STORE_PASSWORD
      # 没配这些 secret 时（例如 PR、fork）自动跳过 → 退回 debug 签名，构建仍可通过。
      - name: 解码签名材料并写 secrets.properties
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p keys
          printf '%s' "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keys/release.p12
          printf '%s' "${{ secrets.RELEASE_LINEAGE_BASE64 }}"  | base64 -d > keys/lineage.bin
          # ⚠️ 路径必须用正斜杠：Java Properties 会把反斜杠当转义符
          cat > secrets.properties <<EOF
          RELEASE_STORE_FILE=$GITHUB_WORKSPACE/keys/release.p12
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=studyassistant
          RELEASE_LINEAGE_FILE=$GITHUB_WORKSPACE/keys/lineage.bin
          EOF
          echo "OK 签名材料已就绪"

      - name: 编译 release APK
        run: ./gradlew assembleRelease --console=plain

      # AGP 的 signingConfig 不支持 lineage → 构建后用 apksigner 补上（v3-only）
      - name: 用新证书 + lineage 重签（APK Signature Scheme v3 轮换签名）
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          KS_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          set -e
          VER=$(grep -oP 'val appVersionName = "\K[^"]+' app/build.gradle.kts)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p signed
          OUT="signed/StudyAssistant-${VER}-$(date -u +%Y%m%d%H%M).apk"
          "$BT/apksigner" sign \
            --ks keys/release.p12 --ks-key-alias studyassistant \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --lineage keys/lineage.bin \
            --rotation-min-sdk-version 28 --min-sdk-version 28 \
            --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true \
            --out "$OUT" app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --print-certs "$OUT"
          echo "SIGNED_APK=$OUT" >> "$GITHUB_ENV"
          echo "OK 轮换签名完成：$OUT"

      - name: 上传 APK（构建产物，任何触发都会保留 30 天）
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            signed/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      # 标签推送 → 只负责「编译 + 挂附件」：
      #   建 draft Release（草稿），发布者补充图文分组说明后再点发布，
      #   这样 Release 说明与历史版本保持同一种格式（中文、emoji 分组）。
      #   若想改成 GitHub 自动生成说明：draft 改 false，generate_release_notes 改 true。
      # 附件优先挂「带 lineage 的轮换签名包」（signed/），没有签名材料时才挂 AGP 产物。
      - name: 若是标签推送 → 建草稿 Release 并挂上 APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && 'signed/*.apk' || 'app/build/outputs/apk/release/*.apk' }}
          draft: true
          generate_release_notes: false
          fail_on_unmatched_files: false
