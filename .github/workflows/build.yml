name: build
run-name: "${{ (github.ref_name == 'main' || inputs.release_channel == 'beta' || inputs.release_distribution == 'compat') && 'release' || 'build' }}: ${{ inputs.run_description || github.ref_name }}"
# Validation is local and scoped. Push/PR/tag do not start duplicate builds.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main or Develop commit
        required: true
        type: string
      run_description:
        description: Version and concise purpose
        required: true
        type: string
      release_channel:
        description: Explicit beta publication from Develop (otherwise build only)
        required: false
        default: none
        type: choice
        options:
          - none
          - beta
          - stable
      release_distribution:
        description: Explicit distribution identity; compat requires its dedicated branch
        required: false
        default: main
        type: choice
        options:
          - main
          - compat
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check requested source and credential boundary
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_DISTRIBUTION: ${{ inputs.release_distribution }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
        run: |
          case "$GITHUB_REF:$RELEASE_DISTRIBUTION" in
            refs/heads/main:main|refs/heads/Develop:main) ;;
            refs/heads/Compatible:compat) case "$RELEASE_CHANNEL" in stable|beta) ;; *) exit 1 ;; esac ;;
            *) exit 1 ;;
          esac
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          python3 -B tools/check-secrets.py --tracked
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Build unsigned release APK (no application tests)
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --console=plain
      - name: Record APK identity and hashes
        if: github.ref == 'refs/heads/main' || inputs.release_channel == 'beta' || inputs.release_distribution == 'compat'
        env:
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          RELEASE_DISTRIBUTION: ${{ inputs.release_distribution }}
        run: python3 -B tools/ci-release.py
      - uses: actions/upload-artifact@v7.0.2
        if: github.ref == 'refs/heads/main' || inputs.release_channel == 'beta' || inputs.release_distribution == 'compat'
        with:
          name: release-candidate
          path: |
            app/build/release-candidate/*-candidate.apk
            app/build/release-candidate/release-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload development build
        if: github.ref == 'refs/heads/Develop' && inputs.release_channel != 'beta'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: development-build
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
