name: build

# 触发：
#  1) 每次 push 到 main / Develop → 跑测试，不编译 release
#     · Develop = 日常开发线（2026-10-14 起），推上去就跑单测，发版前就有信号
#  2) 推 v* 标签 → 编译并把 APK 自动挂到同名 Release
#  3) 手动触发（Actions 页面 Run workflow）
on:
  push:
    branches: [main, Develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      android_tests:
        description: Run isolated Android tests on a CI emulator
        type: boolean
        default: false

permissions:
  contents: read

# 同一分支的新提交取消旧检查；不同分支/tag 不互相取消，tag 构建不中途取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows-tools:
    name: Windows tool tests
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows PowerShell 与开发工具回归（不编译 Android）
        run: python -B -m unittest discover -s tools/tests -p 'test_*.py'

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          # Trusted development pushes may save caches; PR/tag runs only read them.
          cache-read-only: ${{ github.event_name != 'push' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/Develop') }}

      - name: 扫描跟踪文件中的密钥与校验开发工具
        run: |
          python3 -B tools/check-secrets.py --tracked
          python3 -B -m unittest discover -s tools/tests -p 'test_*.py'

      # ── 发布签名材料（自有证书 + key rotation lineage） ─────────────────────
      # 见 README「发布签名（自有证书 + key rotation）」。仓库 Secrets 里存三样：
      #   RELEASE_KEYSTORE_BASE64 / RELEASE_LINEAGE_BASE64 / RELEASE_STORE_PASSWORD
      # 只在 tag 构建读取签名 Secrets；缺少材料时停止生成发布附件。分支 / PR 无需密钥。
      # ⚠️ 注意：`secrets` 上下文**不能**出现在 `if:` / `with:` 表达式里（工作流校验会直接判失败，
      #    表现为 run 在 0 秒内 failure）→ 这里改成"步骤内判断 + 写 $GITHUB_ENV 标记"。
      - name: 解码签名材料（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          LN_B64: ${{ secrets.RELEASE_LINEAGE_BASE64 }}
          KS_PW: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$LN_B64" ] || [ -z "$KS_PW" ]; then
            echo "::error::发布签名 Secrets 不完整，停止 tag 构建，禁止生成替代签名附件"
            exit 1
          fi
          mkdir -p keys
          printf '%s' "$KS_B64" | base64 -d > keys/release.p12
          printf '%s' "$LN_B64" | base64 -d > keys/lineage.bin
          # ⚠️ 路径必须用正斜杠：Java Properties 会把反斜杠当转义符，路径会失效并**静默回退**到 debug 签名
          cat > secrets.properties <<EOF
          RELEASE_STORE_FILE=$GITHUB_WORKSPACE/keys/release.p12
          RELEASE_STORE_PASSWORD=$KS_PW
          RELEASE_KEY_ALIAS=studyassistant
          RELEASE_LINEAGE_FILE=$GITHUB_WORKSPACE/keys/lineage.bin
          EOF
          echo "SIGNED_READY=1" >> "$GITHUB_ENV"
          echo "OK 签名材料已就绪"

      # One Gradle invocation shares configuration and task execution across variants.
      # Release/R8/vital lint still run on every v* tag; device tests are not executed.
      - name: 单测与测试包编译（tag 额外构建 release）
        run: |
          chmod +x ./gradlew
          tasks=(testDebugUnitTest assembleIntegration assembleIntegrationAndroidTest)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tasks+=(assembleRelease)
          fi
          ./gradlew "${tasks[@]}" --console=plain

      - name: 校验数据库迁移与 Room 表结构
        run: python3 tools/verify-identity-migration.py

      - name: 提供独立测试 APK（tag 或手动设备检查）
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.android_tests)
        uses: actions/upload-artifact@v4
        with:
          name: integration-apks
          path: |
            app/build/outputs/apk/integration/app-integration.apk
            app/build/outputs/apk/androidTest/integration/app-integration-androidTest.apk
          if-no-files-found: error
          retention-days: 3

      # AGP 的 signingConfig 不支持 lineage → 构建后用 apksigner 补上（v3-only）
      # ★ 2026-10-13：必须同时要求"是 tag 推送"——分支推送按 A 方案不再编译 release，
      #   只判断 SIGNED_READY 会让这一步去找不存在的 app-release.apk 而报 FileNotFoundException（曾真实发生）。
      - name: 用新证书 + lineage 重签（APK Signature Scheme v3 轮换签名）
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNED_READY == '1'
        env:
          KS_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          set -e
          VER=$(grep -oP 'val appVersionName = "\K[^"]+' app/build.gradle.kts)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p signed
          STAMP=$(unzip -p app/build/outputs/apk/release/app-release.apk assets/build-time-utc.txt)
          [[ "$STAMP" =~ ^[0-9]{14}$ ]] || { echo "::error::Invalid APK UTC build identity"; exit 1; }
          OUT="signed/StudyAssistant-${VER}-${STAMP}.apk"
          "$BT/apksigner" sign \
            --ks keys/release.p12 --ks-key-alias studyassistant \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --lineage keys/lineage.bin \
            --rotation-min-sdk-version 28 --min-sdk-version 28 \
            --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true \
            --out "$OUT" app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --print-certs "$OUT"
          echo "SIGNED_APK=$OUT" >> "$GITHUB_ENV"
          echo "OK 轮换签名完成：$OUT"

      # ★ 2026-10-13：构件只在 tag 推送时才有（分支推送按 A 方案不再编译 release），
      #   所以这一步也只在 tag 上跑，避免分支推送出现"没有文件可上传"的空步骤。
      - name: 上传 APK（仅 tag 推送；构建产物保留 30 天）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          # 有轮换签名包时**只传它**：AGP 那一份（无 lineage）与它同名，同传会让构件里出现
          # 两个同名但签名不同的 APK，容易拿错
          path: signed/*.apk
          retention-days: 30
          if-no-files-found: error

      # 标签推送先建草稿并上传签名 APK；整个工作流通过后，
      #   按维护者持续授权补齐更新说明、校验附件并正式发布。
      #   这样 Release 说明与历史版本保持同一种格式（中文、emoji 分组）。
      #   若想改成 GitHub 自动生成说明：draft 改 false，generate_release_notes 改 true。
      # 只挂已重签的正式包；缺少签名材料时前面的 tag 步骤已经失败。
      - name: 若是标签推送 → 建草稿 Release 并挂上 APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: signed/*.apk
          draft: true
          generate_release_notes: false
          fail_on_unmatched_files: true

      - name: 失败时保留 JVM 测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-${{ github.run_id }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

  android-device:
    name: Android emulator tests
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.android_tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: integration-apks
          path: app/build/outputs/apk
      - name: Enable KVM on the disposable CI runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute isolated tests on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-port: 5554
          disable-animations: true
          script: |
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" >/dev/null
            python3 -B tools/run-android-integration.py --serial emulator-5554 --expected-tests 16
      - name: Save Android test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-log
          path: app/build/android-integration/instrumentation.log
          if-no-files-found: ignore
          retention-days: 7
