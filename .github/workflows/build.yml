name: build
run-name: "${{ github.event_name == 'workflow_dispatch' && format('{0}: {1}', inputs.mode, github.sha) || format('check: {0}', github.ref_name) }}"
# main/tag do not trigger duplicate builds. CI never receives local signing materials.
on:
  push:
    branches: [Develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: check, device, or an unsigned release candidate
        type: choice
        options: [check, device, release]
        default: check
      expected_sha:
        description: Optional immutable source commit required by the release coordinator
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.mode == 'release' && 'release' || 'check' }}
  cancel-in-progress: ${{ inputs.mode != 'release' }}
jobs:
  windows-tools:
    name: Windows tool tests
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s tools/tests -p 'test_*.py'
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'check' }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Check immutable source and clean CI inputs
        run: |
          if [[ -n "$EXPECTED_SHA" && "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Source moved after dispatch"; exit 1
          fi
          if [[ "$MODE" == release && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Release candidates must use main"; exit 1
          fi
          test ! -e secrets.properties
          test ! -e keys
          test ! -e .secrets
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/Develop') }}
      - name: Credential boundary and tool regression
        run: |
          python3 -B tools/check-secrets.py --tracked
          python3 -B -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Full JVM tests and required compilation (one Gradle invocation)
        run: |
          chmod +x ./gradlew
          tasks=(testDebugUnitTest)
          if [[ "$MODE" == device || "$MODE" == release ]]; then
            tasks+=(assembleIntegration assembleIntegrationAndroidTest)
          fi
          if [[ "$MODE" == release ]]; then tasks+=(assembleRelease); fi
          ./gradlew "${tasks[@]}" --console=plain
      - name: SQLite migration verification
        run: python3 -B tools/verify-identity-migration.py
      - name: Prepare unsigned candidate and public manifest
        if: env.MODE == 'release'
        run: python3 -B tools/ci-release.py
      - name: Upload candidate allowlist
        if: env.MODE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: |
            app/build/release-candidate/*-candidate.apk
            app/build/release-candidate/release-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload isolated test APK allowlist
        if: env.MODE == 'device' || env.MODE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: integration-apks
          path: |
            app/build/outputs/apk/integration/app-integration.apk
            app/build/outputs/apk/androidTest/integration/app-integration-androidTest.apk
          if-no-files-found: error
          retention-days: 3
      - name: Preserve small JVM reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: app/build/test-results/testDebugUnitTest/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 7
  android-device:
    name: Android emulator tests (API ${{ matrix.api }})
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    needs: build
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'device' || inputs.mode == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: integration-apks
          path: app/build/outputs/apk
      - name: Enable KVM on disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          emulator-port: 5554
          disable-animations: true
          script: |
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" >/dev/null
            python3 -B tools/run-android-integration.py --serial emulator-5554
      - name: Preserve synthetic-data test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-log-api-${{ matrix.api }}
          path: app/build/android-integration/instrumentation.log
          if-no-files-found: ignore
          retention-days: 7
